<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Masked Repetition vs Unrelated Priming Task</title>
  <!-- jsPsych -->
  <script src="https://unpkg.com/jspsych@7.3.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>
<body></body>
<script>
// initialize jsPsych
const jsPsych = initJsPsych({
  on_finish: () => jsPsych.data.displayData()
});

// timeline
const timeline = [];

// Instructions
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<p>これからマスクド・プライミング課題を行います。</p>
             <p>プライム（隠された単語）の後にターゲット単語が表示されます。</p>
             <p>英語として実在する単語の場合はFキー、非実在語の場合はJキーを押してください。</p>
             <p>準備ができたらスペースキーを押してください。</p>`,
  choices: [' ']
});

// Define stimuli: repetition, unrelated, nonword
const primeTargetPairs = [
  // Repetition (real words)
  { prime: 'dog',    target: 'dog',    condition: 'repetition' },
  { prime: 'cat',    target: 'cat',    condition: 'repetition' },
  { prime: 'bread',  target: 'bread',  condition: 'repetition' },
  { prime: 'book',   target: 'book',   condition: 'repetition' },
  { prime: 'chair',  target: 'chair',  condition: 'repetition' },
  // Unrelated (real words)
  { prime: 'dog',    target: 'cat',    condition: 'unrelated' },
  { prime: 'cat',    target: 'dog',    condition: 'unrelated' },
  { prime: 'bread',  target: 'chair',  condition: 'unrelated' },
  { prime: 'book',   target: 'dog',    condition: 'unrelated' },
  { prime: 'chair',  target: 'cat',    condition: 'unrelated' },
  // Nonword trials
  { prime: 'narp',   target: 'flib',   condition: 'nonword' },
  { prime: 'glorp',  target: 'blat',   condition: 'nonword' },
  { prime: 'snarp',  target: 'plim',   condition: 'nonword' },
  { prime: 'flim',   target: 'norp',   condition: 'nonword' },
  { prime: 'slaf',   target: 'trom',   condition: 'nonword' }
];

// Trial procedure
const trial = {
  timeline: [
    // fixation
    { type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:36px; text-align:center; line-height:1.5;"><span style="display:inline-block; width:200px; text-align:center;">+</span></div>',
      choices: 'NO_KEYS',
      trial_duration: 500,
      prompt: '<p style="visibility:hidden;">実在語ならFキー，非実在語ならJキーを押してください。</p>'
    },
    // forward mask
    { type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:36px; text-align:center; line-height:1.5;"><span style="display:inline-block; width:200px; text-align:center;">#######</span></div>',
      choices: 'NO_KEYS',
      trial_duration: 500,
      prompt: '<p style="visibility:hidden;">実在語ならFキー，非実在語ならJキーを押してください。</p>'
    },
    // prime (brief)
    { type: jsPsychHtmlKeyboardResponse,
      stimulus: () => `<div style="font-size:36px; text-align:center; line-height:1.5;"><span style="display:inline-block; width:200px; text-align:center;">${jsPsych.timelineVariable('prime')}</span></div>`,
      choices: 'NO_KEYS',
      trial_duration: 40,
      prompt: '<p style="visibility:hidden;">実在語ならFキー，非実在語ならJキーを押してください。</p>'
    },
    // backward mask
    { type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:36px; text-align:center; line-height:1.5;"><span style="display:inline-block; width:200px; text-align:center;">#######</span></div>',
      choices: 'NO_KEYS',
      trial_duration: 50,
      prompt: '<p style="visibility:hidden;">実在語ならFキー，非実在語ならJキーを押してください。</p>'
    },
    // target & lexical decision
    { type: jsPsychHtmlKeyboardResponse,
      stimulus: () => `<div style="font-size:36px; text-align:center; line-height:1.5;"><span style="display:inline-block; width:200px; text-align:center;">${jsPsych.timelineVariable('target')}</span></div>`,
      choices: ['f','j'],
      prompt: '<p>実在語ならFキー，非実在語ならJキーを押してください。</p>',
      data: { condition: jsPsych.timelineVariable('condition') }
    }
  ],
  timeline_variables: primeTargetPairs,
  randomize_order: true
};
timeline.push(trial);

// Debrief
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: () => {
    const data = jsPsych.data.get();
    // 実在語の正解試行のみフィルタ（Fキーを押した試行）
    const correctRealWords = data.filter({ response: 'f' });
    const meanRepetition = correctRealWords.filter({ condition: 'repetition' }).select('rt').mean().toFixed(1);
    const meanUnrelated  = correctRealWords.filter({ condition: 'unrelated' }).select('rt').mean().toFixed(1);
    const primingEffect = (meanUnrelated - meanRepetition).toFixed(1);

    // 非実在語の正解試行（Jキーを押した試行）
    const correctNonwords = data.filter({ response: 'j', condition: 'nonword' });
    const meanNonword = correctNonwords.select('rt').mean().toFixed(1);

    return `<p>課題終了です。</p>
            <p>【実在語】</p>
            <p>Repetition条件の平均RT: ${meanRepetition} ms</p>
            <p>Unrelated条件の平均RT: ${meanUnrelated} ms</p>
            <p>プライミング効果: ${primingEffect} ms</p>
            <p>【非実在語】</p>
            <p>Nonword条件の平均RT: ${meanNonword} ms</p>
            <div style="max-width: 760px; margin: 24px auto; padding: 16px 18px; text-align: left; background: #f8f9fa; border-left: 4px solid #1a3a52;">
              <h3>この実験の種明かし</h3>
              <p><strong>何を調べていたか：</strong>この課題では，短時間だけ表示されたプライムが，直後のターゲット単語の語彙判断に影響するかを調べていました。</p>
              <p><strong>操作した条件：</strong>ターゲットがプライムと同じ単語である反復条件（例：dog → dog）と，関連しない単語が先に出る非関連条件（例：dog → cat）を比べています。</p>
              <p><strong>マスクの役割：</strong>プライムの前後に ####### を出し，プライムを40ミリ秒だけ提示しています。これにより，参加者がプライムをはっきり意識して方略的に使うことを難しくしています。</p>
              <p><strong>結果の読み方：</strong>反復条件の反応時間が非関連条件より短ければ，直前に同じ語が処理されたことによってターゲットの認識が促進された可能性があります。</p>
              <p><strong>教育用デモとして：</strong>画面環境や個人差によってプライムの見え方は変わります。この結果だけで「完全に無意識だった」と結論づけるのではなく，マスクド・プライミングの基本構造を体験するデモとして読んでください。</p>
              <p><strong>参考文献：</strong>Forster, K. I., &amp; Davis, C. (1984). Repetition priming and frequency attenuation in lexical access. <em>Journal of Experimental Psychology: Learning, Memory, and Cognition, 10</em>(4), 680-698.</p>
            </div>
            <p>ご協力ありがとうございました。スペースキーで終了します。</p>`;
  },
  choices: [' ']
});

// start
jsPsych.run(timeline);
</script>
</html>
