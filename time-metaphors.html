<!DOCTYPE html>
<html>
<head>
  <title>心的時間線デモ実験</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    /* 画面中央にテキストを配置するためのスタイル */
    .jspsych-display-element {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 24px;
    }
  </style>
</head>
<body></body>
<script>

  // 1. jsPsychの初期化
  const jsPsych = initJsPsych({
    on_finish: function() {
      // 5. 結果の集計と表示
      jsPsych.data.get().filter({task: 'response', correct: true});
      const congruent_rt = jsPsych.data.get().filter({condition: 'congruent', correct: true}).select('rt').mean();
      const incongruent_rt = jsPsych.data.get().filter({condition: 'incongruent', correct: true}).select('rt').mean();

      const results_html = `
        <div>
          <h2>実験結果</h2>
          <p>（正しく回答された試行のみの平均反応時間）</p>
          <p style="font-size: 28px; color: blue;">
            【一致条件】の平均反応時間: <strong>${congruent_rt.toFixed(2)} ミリ秒</strong>
          </p>
          <p style="font-size: 28px; color: red;">
            【不一致条件】の平均反応時間: <strong>${incongruent_rt.toFixed(2)} ミリ秒</strong>
          </p>
          <br>
          <p>仮説通りなら、【一致条件】の方が速くなっているはずです。</p>
          <p>これは、「過去＝左」「未来＝右」という対応付けが自動的に働いた証拠かもしれません。</p>
          <p>実験は終了です。ブラウザを閉じてください。</p>
        </div>
      `;
      jsPsych.getDisplayElement().innerHTML = results_html;
    }
  });

  // 2. 実験のタイムライン（手順）を定義
  const timeline = [];

  // 教示文
  const instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div>
        <p>心的時間線のデモ実験へようこそ！</p>
        <p>画面の左か右に、時間に関する単語が表示されます。</p>
        <p>単語が <span style="color: blue;"><strong>過去</strong></span> を表す場合は <strong>Eキー</strong> を、</p>
        <p><span style="color: red;"><strong>未来</strong></span> を表す場合は <strong>Iキー</strong> を押してください。</p>
        <p>できるだけ速く、正確にお願いします。</p>
        <br>
        <p>準備ができたら、何かキーを押して開始してください。</p>
      </div>
    `,
    post_trial_gap: 500
  };
  timeline.push(instructions);

  // 3. 刺激（単語、種類、位置など）を定義
  const test_stimuli = [
    { word: '昨日', type: 'past' },
    { word: '去年', type: 'past' },
    { word: '先週', type: 'past' },
    { word: '昔',   type: 'past' },
    { word: '明日', type: 'future' },
    { word: '来年', type: 'future' },
    { word: '来週', type: 'future' },
    { word: '将来', type: 'future' },
  ];

  // 注視点
  const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div style="font-size: 60px;">+</div>',
    choices: "NO_KEYS",
    trial_duration: 1000,
  };

  // 実験試行
  const trial = {
    type: jsPsychHtmlKeyboardResponse,
    // *** ここが修正点です ***
    stimulus: function(){
      const word = jsPsych.timelineVariable('word');
      const position = jsPsych.randomization.sampleWithReplacement(['left', 'right'], 1)[0];
      jsPsych.data.addProperties({position: position});
      
      const horizontal_pos = position === 'left' ? '25%' : '75%';

      // 全体を一つのコンテナで囲み、位置指定の基準とします
      return `
        <div style="position: relative; width: 100vw; height: 100vh;">
          
          <p style="position: absolute; left: ${horizontal_pos}; top: 50%; transform: translate(-50%, -50%); font-size: 40px;">
            ${word}
          </p>
          
          <div style="position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; font-size: 20px; color: #333;">
            <span style="color: blue;"><strong>過去 [E]</strong></span>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <span style="color: red;"><strong>未来 [I]</strong></span>
          </div>

        </div>
      `;
    },
    choices: ['e', 'i'],
    data: {
      task: 'response',
      word: jsPsych.timelineVariable('word'),
      type: jsPsych.timelineVariable('type'),
    },
    on_finish: function(data){
      // 一致/不一致条件を判定
      if ((data.type === 'past' && data.position === 'left') || (data.type === 'future' && data.position === 'right')) {
        data.condition = 'congruent';
      } else {
        data.condition = 'incongruent';
      }
      
      // 正誤判定
      const correct_key = data.type === 'past' ? 'e' : 'i';
      data.correct = jsPsych.pluginAPI.compareKeys(data.response, correct_key);
    }
  };

  // 4. 試行をまとめた手続きを作成
  const trial_procedure = {
    timeline: [fixation, trial],
    timeline_variables: test_stimuli,
    randomize_order: true,
    repetitions: 4
  };
  timeline.push(trial_procedure);

  // 実験の実行
  jsPsych.run(timeline);

</script>
</html>
